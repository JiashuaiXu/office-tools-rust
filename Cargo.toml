[package]
name = "actix-tools"
version = "0.1.0"
edition = "2021"
authors = ["Your Name <your.email@example.com>"]
description = "A web-based tool for managing and executing Python scripts"

[dependencies]
actix-web = "4.4"
actix-files = "0.6"
actix-cors = "0.6"
tokio = { version = "1.35", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
env_logger = "0.10"
log = "0.4"
futures = "0.3"
anyhow = "1.0"
thiserror = "1.0"
tokio-util = "0.7"
uuid = { version = "1.6", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
config = "0.13" 
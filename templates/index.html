<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Actix Tools - Python 脚本管理器</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Python 脚本管理器</h1>
            <p>选择并运行 Python 脚本</p>
        </header>

        <main>
            <div class="script-panel">
                <select id="scriptSelect">
                    <option value="">选择脚本...</option>
                </select>
                <button id="runScript" class="btn primary">运行脚本</button>
            </div>

            <div class="output-panel">
                <h3>输出结果</h3>
                <pre id="output"></pre>
            </div>
        </main>

        <footer>
            <p>Powered by Rust + Actix-web</p>
        </footer>
    </div>

    <script src="/static/js/main.js"></script>
</body>
</html>
